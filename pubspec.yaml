name: quran_i_kerim
description: Kur’an-ı Kerim, sesli Kuran, mealler ve okuma planları için hafif ve modern Flutter uygulaması.
publish_to: "none"
version: 0.4.1+5

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  audioplayers: ^6.8.1
  adhan_dart: ^2.0.1
  flutter_compass: ^0.8.1
  flutter_local_notifications: ^22.3.0
  flutter_timezone: ^5.1.0
  geolocator: ^14.0.3
  path_provider: ^2.1.5
  quran: ^1.4.1
  shared_preferences: ^2.5.3
  timezone: ^0.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/translations/tr_rwwad.json.gz
    - assets/data/translations/en_rwwad.json.gz
