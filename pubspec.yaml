name: quran_i_kerim
description: Kur’an-ı Kerim, sesli Kuran, mealler ve okuma planları için hafif ve modern Flutter uygulaması.
publish_to: "none"
version: 0.4.1+5

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  audio_service: ^0.18.19
  audioplayers: ^6.8.1
  connectivity_plus: ^6.1.5
  adhan_dart: ^2.0.1
  extension_google_sign_in_as_googleapis_auth: ^3.0.0
  file_picker: ^12.2.0
  flutter_compass: ^0.8.1
  flutter_local_notifications: ^22.3.0
  flutter_timezone: ^5.1.0
  geolocator: ^14.0.3
  google_sign_in: ^7.2.0
  googleapis: ^17.0.0
  lat_lng_to_timezone: ^0.2.0
  path_provider: ^2.1.5
  quran: ^1.4.1
  record: ^7.1.1
  share_plus: ^13.3.0
  shared_preferences: ^2.5.3
  timezone: ^0.11.0
  wakelock_plus: 1.4.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  http: ^1.6.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/data/translations/tr_rwwad.json.gz
    - assets/data/translations/en_rwwad.json.gz
    - assets/data/transliterations/en_transliteration.json.gz
    - assets/data/locations/cities5000.json.gz
