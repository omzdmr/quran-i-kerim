name: Apply reader audio v08

on:
  push:
    branches: [ feature/localization-v01 ]
    paths:
      - '.github/workflows/apply-reader-audio-v08.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/localization-v01
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Apply patch
        run: python3 tool/apply_reader_audio_v08.py

      - name: Format changed Dart
        run: dart format lib/src/features/reader/reader_audio_cache.dart lib/src/features/reader/reader_audio_sheet.dart lib/src/features/reader/quran_reader_screen.dart

      - name: Commit source changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/src/features/reader/reader_audio_cache.dart lib/src/features/reader/reader_audio_sheet.dart lib/src/features/reader/quran_reader_screen.dart
          git commit -m 'Decouple reader scroll from audio and add disk prefetch'
          git push origin HEAD:feature/localization-v01
