name: French remaining typed validation

on:
  push:
    branches: [ manual/french-remaining-typed-strings ]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Fetch and validate bundled content
        run: python3 tool/fetch_content.py

      - name: Get dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Check formatting
        run: |
          dart format --output=none --set-exit-if-changed \
            lib/src/l10n/strings/learn_reference_strings.dart \
            lib/src/l10n/strings/learn_strings.dart \
            lib/src/l10n/strings/prayer_notification_diagnostics_strings.dart \
            test/french_typed_string_parity_test.dart

      - name: Run French typed parity test
        run: timeout 180s flutter test test/french_typed_string_parity_test.dart --reporter expanded

      - name: Run general feature parity test
        run: timeout 120s flutter test test/feature_strings_test.dart --reporter expanded

      - name: Run Plans parity test
        run: timeout 120s flutter test test/plan_strings_test.dart --reporter expanded
