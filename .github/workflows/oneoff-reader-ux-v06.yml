name: One-off reader UX v06 patch

on:
  push:
    branches: [ feature/localization-v01 ]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Prepare reader UX v06 patch'
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout active branch
        uses: actions/checkout@v4
        with:
          ref: feature/localization-v01
          fetch-depth: 0

      - name: Setup Flutter formatter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Apply focused patch
        run: python3 tool/apply_reader_ux_v06.py

      - name: Format changed Dart files
        run: >-
          dart format
          lib/src/data/surah_localization.dart
          lib/src/data/translation_catalog.dart
          lib/src/settings/app_settings.dart
          lib/src/features/home/home_screen.dart
          lib/src/features/reader/quran_reader_screen.dart
          lib/src/features/reader/reader_audio_sheet.dart
          lib/src/features/reader/reader_note_sheet.dart
          test/app_settings_source_test.dart
          test/surah_localization_test.dart

      - name: Restore workflow files for source-only commit
        run: |
          git checkout HEAD -- .github/workflows/android.yml .github/workflows/oneoff-reader-ux-v06.yml
          git checkout HEAD -- tool/apply_reader_ux_v06.py

      - name: Validate and commit
        run: |
          git diff --check
          git status --short
          test -n "$(git status --porcelain)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply reader UX v06 fixes"
          git push origin HEAD:feature/localization-v01
