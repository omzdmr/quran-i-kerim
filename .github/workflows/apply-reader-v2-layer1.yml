name: Apply Reader v2 layer 1

on:
  push:
    branches: [ feature/localization-v01 ]
    paths:
      - '.github/workflows/apply-reader-v2-layer1.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: feature/localization-v01
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Configure git
        run: |
          git config user.name "omzdmr"
          git config user.email "154471764+omzdmr@users.noreply.github.com"

      - name: Fetch bundled content
        run: python3 tool/fetch_content.py

      - name: Remove analyzer-only unused local from helper
        run: sed -i "/final title = language == 'tr'/d" tool/apply_reader_v2_layer1.py

      - name: Apply and validate Reader v2 slices
        run: python3 tool/apply_reader_v2_layer1.py
