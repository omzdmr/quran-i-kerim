name: iOS Parity

on:
  push:
    branches: [ automation/ios-parity ]
  workflow_dispatch:

concurrency:
  group: ios-parity-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Show toolchain
        run: |
          flutter --version
          xcodebuild -version

      # The iOS project is source-controlled. Never regenerate it here: doing
      # so would make CI validate Flutter's template instead of our native code.
      - name: Validate committed iOS scaffold
        run: |
          test -f ios/Runner.xcodeproj/project.pbxproj
          test -f ios/Runner.xcodeproj/xcshareddata/xcschemes/Runner.xcscheme
          test -f ios/Runner.xcworkspace/contents.xcworkspacedata
          test -f ios/Runner/AppDelegate.swift
          test -f ios/Runner/AudioSessionCoordinator.swift
          test -f ios/Runner/Info.plist
          test -f ios/Runner/PrivacyInfo.xcprivacy
          test -f ios/Podfile
          plutil -lint ios/Runner/Info.plist
          plutil -lint ios/Runner/PrivacyInfo.xcprivacy
          plutil -lint ios/Flutter/AppFrameworkInfo.plist
          for locale in en tr ar az ru fr; do
            strings_file="ios/Runner/${locale}.lproj/InfoPlist.strings"
            test -f "$strings_file"
            plutil -lint "$strings_file"
            grep -q "CFBundleDisplayName" "$strings_file"
            grep -q "NSLocationWhenInUseUsageDescription" "$strings_file"
            grep -q "NSMicrophoneUsageDescription" "$strings_file"
            grep -q "name = ${locale};" ios/Runner.xcodeproj/project.pbxproj
          done
          ruby -c ios/Podfile
          grep -q "PRODUCT_BUNDLE_IDENTIFIER = com.omzdmr.quranIKerim" ios/Runner.xcodeproj/project.pbxproj
          grep -q "AudioSessionCoordinator.swift in Sources" ios/Runner.xcodeproj/project.pbxproj
          grep -q "NSLocationWhenInUseUsageDescription" ios/Runner/Info.plist
          grep -q "NSMicrophoneUsageDescription" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes:0" ios/Runner/Info.plist | grep -qx audio

      # This native compiler gate stays useful even when a shared Flutter asset
      # blocks bundle assembly later in the job.
      - name: Type-check native audio lifecycle
        run: |
          xcrun --sdk iphonesimulator swiftc \
            -parse-as-library \
            -target arm64-apple-ios14.0-simulator \
            -typecheck ios/Runner/AudioSessionCoordinator.swift

      - name: Get dependencies
        run: flutter pub get

      - name: Install iOS pods from committed project
        working-directory: ios
        run: pod install

      - name: Audit committed Xcode graph
        run: |
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -sdk iphonesimulator \
            -showBuildSettings \
            CODE_SIGNING_ALLOWED=NO > /tmp/runner-build-settings.txt
          grep -q "PRODUCT_BUNDLE_IDENTIFIER = com.omzdmr.quranIKerim" /tmp/runner-build-settings.txt
          grep -q "IPHONEOS_DEPLOYMENT_TARGET = 14.0" /tmp/runner-build-settings.txt
          git diff --exit-code -- \
            ios/Runner \
            ios/Runner.xcodeproj \
            ios/Podfile \
            ios/Flutter/Debug.xcconfig \
            ios/Flutter/Release.xcconfig

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Analyze shared app without modifying it
        run: flutter analyze lib --no-fatal-infos

      # Shared tests are evidence only on this staging branch. A shared asset or
      # feature regression must not hide the native iOS compiler result.
      - name: Run shared tests
        id: shared_tests
        continue-on-error: true
        run: flutter test

      # iOS Simulator supports debug/profile compilation, not release mode.
      # This is our signing-independent native compiler/plugin gate; a real
      # device archive remains a separate Apple signing/provisioning gate.
      - name: Build iOS simulator app
        id: ios_build
        continue-on-error: true
        run: flutter build ios --simulator --debug

      - name: Verify simulator app output
        if: steps.ios_build.outcome == 'success'
        run: |
          test -d build/ios/iphonesimulator/Runner.app
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" build/ios/iphonesimulator/Runner.app/Info.plist | grep -qx com.omzdmr.quranIKerim
          /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" build/ios/iphonesimulator/Runner.app/Info.plist | grep -qx "Kur’an-ı Kerim"
          /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes:0" build/ios/iphonesimulator/Runner.app/Info.plist | grep -qx audio
          /usr/libexec/PlistBuddy -c "Print :NSLocationWhenInUseUsageDescription" build/ios/iphonesimulator/Runner.app/Info.plist
          /usr/libexec/PlistBuddy -c "Print :NSMicrophoneUsageDescription" build/ios/iphonesimulator/Runner.app/Info.plist
          for locale in en tr ar az ru fr; do
            test -f "build/ios/iphonesimulator/Runner.app/${locale}.lproj/InfoPlist.strings"
          done

      - name: Upload simulator build for parity inspection
        if: steps.ios_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: quran-i-kerim-ios-simulator-app
          path: build/ios/iphonesimulator/Runner.app
          if-no-files-found: error
          retention-days: 7

      - name: Report independent parity gates
        if: always()
        run: |
          failed=0

          if [[ "${{ steps.shared_tests.outcome }}" != "success" ]]; then
            echo "::error::Shared Flutter tests failed on this staging snapshot."
            echo "Shared-code correction belongs to CI/Feature ownership; refresh/rebase before landing."
            failed=1
          fi

          if [[ "${{ steps.ios_build.outcome }}" != "success" ]]; then
            echo "::error::The signing-independent iOS simulator build failed."
            echo "The earlier native Swift type-check remains an independent result."
            failed=1
          fi

          if [[ "$failed" -ne 0 ]]; then
            exit 1
          fi
