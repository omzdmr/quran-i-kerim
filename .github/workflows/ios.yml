name: iOS Parity

on:
  push:
    branches: [ automation/ios-parity ]
  workflow_dispatch:

concurrency:
  group: ios-parity-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Show toolchain
        run: |
          flutter --version
          xcodebuild -version

      - name: Validate committed iOS scaffold
        run: |
          test -f ios/Runner.xcodeproj/project.pbxproj
          test -f ios/Runner.xcodeproj/xcshareddata/xcschemes/Runner.xcscheme
          test -f ios/Runner.xcworkspace/contents.xcworkspacedata
          for file in AppDelegate.swift AudioSessionCoordinator.swift BackupExclusionCoordinator.swift BackupExclusionChannel.swift WidgetSnapshotStore.swift WidgetSnapshotChannel.swift NativeLifecycleStateChannel.swift MicrophoneRecordingChannel.swift NativeShareChannel.swift Runner.entitlements; do test -f "ios/Runner/$file"; done
          test -f ios/NativeTests/BackupExclusionCoordinatorValidation.swift
          test -f ios/NativeTests/WidgetSnapshotValidation.swift
          test -f ios/PrayerWidget/PrayerWidget.swift
          test -f ios/PrayerWidget/Info.plist
          test -f ios/PrayerWidget/PrayerWidget.entitlements
          test -f ios/Runner/Info.plist
          test -f ios/Runner/PrivacyInfo.xcprivacy
          test -f ios/Podfile
          plutil -lint ios/Runner/Info.plist
          plutil -lint ios/Runner/PrivacyInfo.xcprivacy
          plutil -lint ios/Runner/Runner.entitlements
          plutil -lint ios/PrayerWidget/Info.plist
          plutil -lint ios/PrayerWidget/PrayerWidget.entitlements
          plutil -lint ios/Flutter/AppFrameworkInfo.plist
          for locale in en tr ar az ru fr; do
            strings_file="ios/Runner/${locale}.lproj/InfoPlist.strings"
            widget_strings="ios/PrayerWidget/${locale}.lproj/Localizable.strings"
            test -f "$strings_file"; test -f "$widget_strings"
            plutil -lint "$strings_file"; plutil -lint "$widget_strings"
            grep -q "CFBundleDisplayName" "$strings_file"
            grep -q "NSLocationWhenInUseUsageDescription" "$strings_file"
            grep -q "NSMicrophoneUsageDescription" "$strings_file"
            grep -q "NotificationSelfTestTitle" "$strings_file"
            grep -q "NotificationSelfTestBody" "$strings_file"
            grep -q "name = ${locale};" ios/Runner.xcodeproj/project.pbxproj
          done
          ruby -c ios/Podfile
          grep -q "PRODUCT_BUNDLE_IDENTIFIER = com.omzdmr.quranIKerim" ios/Runner.xcodeproj/project.pbxproj
          for source in AudioSessionCoordinator BackupExclusionCoordinator BackupExclusionChannel WidgetSnapshotStore WidgetSnapshotChannel NativeLifecycleStateChannel MicrophoneRecordingChannel NativeShareChannel; do grep -q "${source}.swift in Sources" ios/Runner.xcodeproj/project.pbxproj; done
          grep -q "PrayerWidget.appex in Embed App Extensions" ios/Runner.xcodeproj/project.pbxproj
          grep -q "com.omzdmr.quranIKerim.PrayerWidget" ios/Runner.xcodeproj/project.pbxproj
          grep -q "group.app.quranikerim.shared" ios/Runner/Runner.entitlements
          grep -q "group.app.quranikerim.shared" ios/PrayerWidget/PrayerWidget.entitlements
          grep -q "CODE_SIGN_ENTITLEMENTS = Runner/Runner.entitlements" ios/Flutter/Debug.xcconfig
          grep -q "CODE_SIGN_ENTITLEMENTS = Runner/Runner.entitlements" ios/Flutter/Release.xcconfig
          grep -q "app.quranikerim/native_widget_snapshot" ios/Runner/WidgetSnapshotChannel.swift
          grep -q "app.quranikerim/native_lifecycle_state" ios/Runner/NativeLifecycleStateChannel.swift
          grep -q "app.quranikerim/native_recording" ios/Runner/MicrophoneRecordingChannel.swift
          grep -q "app.quranikerim/native_share" ios/Runner/NativeShareChannel.swift
          grep -q 'case "scheduleNotificationSelfTest"' ios/Runner/BackupExclusionChannel.swift
          grep -q 'case "getNotificationDiagnostics"' ios/Runner/BackupExclusionChannel.swift
          grep -q "WidgetSnapshotChannel(binaryMessenger: messenger)" ios/Runner/AppDelegate.swift
          grep -q "NativeLifecycleStateChannel(binaryMessenger: messenger)" ios/Runner/AppDelegate.swift
          grep -q "MicrophoneRecordingChannel(binaryMessenger: messenger)" ios/Runner/AppDelegate.swift
          grep -q "NativeShareChannel(binaryMessenger: messenger" ios/Runner/AppDelegate.swift
          grep -q "app.quranikerim/native_document_handoff" ios/Runner/AppDelegate.swift
          grep -q "UIDocumentPickerViewController(forExporting:" ios/Runner/AppDelegate.swift
          grep -q "UIDocumentPickerViewController(forOpeningContentTypes:" ios/Runner/AppDelegate.swift
          grep -q "isExcludedFromBackup = true" ios/Runner/AppDelegate.swift
          grep -q "NSLocationWhenInUseUsageDescription" ios/Runner/Info.plist
          grep -q "NSMicrophoneUsageDescription" ios/Runner/Info.plist
          /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes:0" ios/Runner/Info.plist | grep -qx audio

      - name: Type-check native lifecycle and storage
        run: |
          xcrun --sdk iphonesimulator swiftc -parse-as-library -target arm64-apple-ios15.0-simulator -typecheck ios/Runner/AudioSessionCoordinator.swift ios/Runner/BackupExclusionCoordinator.swift ios/Runner/WidgetSnapshotStore.swift

      - name: Type-check WidgetKit consumer
        run: |
          xcrun --sdk iphonesimulator swiftc -parse-as-library -target arm64-apple-ios17.0-simulator -typecheck ios/PrayerWidget/PrayerWidget.swift

      - name: Validate native backup exclusion boundary
        run: |
          swiftc ios/Runner/BackupExclusionCoordinator.swift ios/NativeTests/BackupExclusionCoordinatorValidation.swift -o /tmp/backup-exclusion-validation
          /tmp/backup-exclusion-validation

      - name: Validate widget snapshot freshness contract
        run: |
          swiftc ios/Runner/WidgetSnapshotStore.swift ios/NativeTests/WidgetSnapshotValidation.swift -o /tmp/widget-snapshot-validation
          /tmp/widget-snapshot-validation

      - name: Fetch and validate bundled content
        run: python3 tool/fetch_content.py
      - name: Get dependencies
        run: flutter pub get

      - name: Install iOS pods from committed project
        id: ios_pods
        continue-on-error: true
        working-directory: ios
        run: pod install

      - name: Audit committed Xcode graph
        if: steps.ios_pods.outcome == 'success'
        run: |
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -sdk iphonesimulator -showBuildSettings CODE_SIGNING_ALLOWED=NO > /tmp/runner-build-settings.txt
          grep -q "PRODUCT_BUNDLE_IDENTIFIER = com.omzdmr.quranIKerim" /tmp/runner-build-settings.txt
          grep -q "IPHONEOS_DEPLOYMENT_TARGET = 15.0" /tmp/runner-build-settings.txt
          grep -q "CODE_SIGN_ENTITLEMENTS = Runner/Runner.entitlements" /tmp/runner-build-settings.txt
          xcodebuild -project ios/Runner.xcodeproj -target PrayerWidget -sdk iphonesimulator -showBuildSettings CODE_SIGNING_ALLOWED=NO > /tmp/widget-build-settings.txt
          grep -q "PRODUCT_BUNDLE_IDENTIFIER = com.omzdmr.quranIKerim.PrayerWidget" /tmp/widget-build-settings.txt
          grep -q "CODE_SIGN_ENTITLEMENTS = PrayerWidget/PrayerWidget.entitlements" /tmp/widget-build-settings.txt
          git diff --exit-code -- ios/Runner ios/PrayerWidget ios/Podfile ios/Flutter/Debug.xcconfig ios/Flutter/Release.xcconfig

      - name: Generate localizations
        run: flutter gen-l10n
      - name: Analyze shared app without modifying it
        run: flutter analyze lib --no-fatal-infos
      - name: Run shared tests
        id: shared_tests
        continue-on-error: true
        run: flutter test

      - name: Build iOS simulator app
        if: steps.ios_pods.outcome == 'success'
        id: ios_build
        continue-on-error: true
        run: flutter build ios --simulator --debug

      - name: Verify simulator app and widget output
        if: steps.ios_build.outcome == 'success'
        run: |
          app=build/ios/iphonesimulator/Runner.app
          widget="$app/PlugIns/PrayerWidget.appex"
          test -d "$app"
          test -d "$widget"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$app/Info.plist" | grep -qx com.omzdmr.quranIKerim
          /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "$app/Info.plist" | grep -qx "Kur’an-ı Kerim"
          /usr/libexec/PlistBuddy -c "Print :UIBackgroundModes:0" "$app/Info.plist" | grep -qx audio
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$widget/Info.plist" | grep -qx com.omzdmr.quranIKerim.PrayerWidget
          /usr/libexec/PlistBuddy -c "Print :NSExtension:NSExtensionPointIdentifier" "$widget/Info.plist" | grep -qx com.apple.widgetkit-extension
          for locale in en tr ar az ru fr; do
            test -f "$app/${locale}.lproj/InfoPlist.strings"
            test -f "$widget/${locale}.lproj/Localizable.strings"
          done

      - name: Upload simulator build for parity inspection
        if: steps.ios_build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: quran-i-kerim-ios-simulator-app
          path: build/ios/iphonesimulator/Runner.app
          if-no-files-found: error
          retention-days: 7

      - name: Report independent parity gates
        if: always()
        run: |
          failed=0
          if [[ "${{ steps.ios_pods.outcome }}" != "success" ]]; then echo "::error::CocoaPods could not integrate the committed Runner project."; failed=1; fi
          if [[ "${{ steps.shared_tests.outcome }}" != "success" ]]; then echo "::error::Shared Flutter tests failed on this staging snapshot."; failed=1; fi
          if [[ "${{ steps.ios_build.outcome }}" != "success" ]]; then echo "::error::iOS simulator build failed."; failed=1; fi
          exit "$failed"
