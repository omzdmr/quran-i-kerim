name: Apply reader package v07

on:
  push:
    branches: [ feature/localization-v01 ]
    paths:
      - '.github/workflows/apply-reader-package-v07.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/localization-v01
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Apply patch
        run: python3 tool/apply_reader_package_v07.py

      - name: Format changed Dart
        run: dart format lib/src/data/quran_verse_metadata.dart lib/src/features/reader/quran_reader_screen.dart lib/src/features/reader/reader_audio_sheet.dart test/surah_localization_test.dart

      - name: Commit source changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/src/data/quran_verse_metadata.dart lib/src/features/reader/quran_reader_screen.dart lib/src/features/reader/reader_audio_sheet.dart test/surah_localization_test.dart
          git commit -m 'Fix reader scroll audio preload and metadata'
          git push origin HEAD:feature/localization-v01
