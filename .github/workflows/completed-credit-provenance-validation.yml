name: Completed Credit Provenance Validation

on:
  push:
    branches: [ manual/completed-plan-credit-provenance ]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Fetch and validate bundled content
        run: python3 tool/fetch_content.py

      - name: Fetch dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Format provenance slice
        run: |
          dart format \
            lib/src/features/plans/reading_plan.dart \
            lib/src/features/plans/reading_plan_store.dart \
            lib/src/features/plans/plans_screen.dart \
            lib/src/l10n/strings/plan_strings.dart \
            test/reading_plan_store_test.dart

      - name: Persist formatter output
        run: |
          TARGETS=(
            lib/src/features/plans/reading_plan.dart
            lib/src/features/plans/reading_plan_store.dart
            lib/src/features/plans/plans_screen.dart
            lib/src/l10n/strings/plan_strings.dart
            test/reading_plan_store_test.dart
          )
          if git diff --quiet -- "${TARGETS[@]}"; then
            echo "Formatter made no target-file changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${TARGETS[@]}"
          git commit -m "style: format completed credit provenance"
          git push origin HEAD:manual/completed-plan-credit-provenance

      - name: Run reading-plan store tests
        run: timeout 180s flutter test test/reading_plan_store_test.dart --reporter expanded

      - name: Run reading-plan model tests
        run: timeout 120s flutter test test/reading_plan_test.dart --reporter expanded

      - name: Run plan localization parity
        run: timeout 120s flutter test test/plan_strings_test.dart --reporter expanded

      - name: Probe focused analyzer
        continue-on-error: true
        run: |
          timeout 120s dart analyze \
            lib/src/features/plans/reading_plan.dart \
            lib/src/features/plans/reading_plan_store.dart \
            lib/src/features/plans/plans_screen.dart
