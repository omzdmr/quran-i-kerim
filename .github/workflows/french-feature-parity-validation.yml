name: French feature-string parity validation

on:
  push:
    branches: [ manual/french-home-learn-feature-strings ]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Format changed localization slice
        run: |
          dart format \
            lib/src/l10n/strings/home_verse_strings.dart \
            lib/src/l10n/strings/learn_catalog_strings.dart \
            lib/src/l10n/strings/prayer_notification_strings.dart \
            lib/src/l10n/strings/reader_audio_transport_strings.dart \
            lib/src/l10n/strings/reader_media_strings.dart \
            lib/src/l10n/strings/reader_navigation_strings.dart \
            lib/src/l10n/strings/reader_note_strings.dart \
            lib/src/l10n/strings/home_quick_action_strings.dart \
            lib/src/l10n/strings/home_recent_reading_strings.dart \
            lib/src/l10n/strings/prayer_notification_diagnostics_strings.dart \
            lib/src/l10n/strings/learn_reference_strings.dart \
            lib/src/l10n/strings/learn_strings.dart \
            test/home_verse_localization_test.dart \
            test/learn_catalog_strings_test.dart \
            test/reader_audio_transport_localization_test.dart \
            test/reader_media_localization_test.dart \
            test/reader_navigation_localization_test.dart \
            test/reader_note_localization_test.dart \
            test/home_quick_actions_settings_test.dart \
            test/home_recent_reading_localization_test.dart \
            test/prayer_notification_diagnostics_localization_test.dart \
            test/learn_reference_catalog_test.dart \
            test/learn_strings_test.dart

      - name: Persist formatter output
        run: |
          TARGETS=(
            lib/src/l10n/strings/home_verse_strings.dart
            lib/src/l10n/strings/learn_catalog_strings.dart
            lib/src/l10n/strings/prayer_notification_strings.dart
            lib/src/l10n/strings/reader_audio_transport_strings.dart
            lib/src/l10n/strings/reader_media_strings.dart
            lib/src/l10n/strings/reader_navigation_strings.dart
            lib/src/l10n/strings/reader_note_strings.dart
            lib/src/l10n/strings/home_quick_action_strings.dart
            lib/src/l10n/strings/home_recent_reading_strings.dart
            lib/src/l10n/strings/prayer_notification_diagnostics_strings.dart
            lib/src/l10n/strings/learn_reference_strings.dart
            lib/src/l10n/strings/learn_strings.dart
            test/home_verse_localization_test.dart
            test/learn_catalog_strings_test.dart
            test/reader_audio_transport_localization_test.dart
            test/reader_media_localization_test.dart
            test/reader_navigation_localization_test.dart
            test/reader_note_localization_test.dart
            test/home_quick_actions_settings_test.dart
            test/home_recent_reading_localization_test.dart
            test/prayer_notification_diagnostics_localization_test.dart
            test/learn_reference_catalog_test.dart
            test/learn_strings_test.dart
          )
          if git diff --quiet -- "${TARGETS[@]}"; then
            echo "Formatter made no target-file changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${TARGETS[@]}"
          git commit -m "style: format French feature strings [skip ci]"
          git push origin HEAD:manual/french-home-learn-feature-strings

      - name: Verify English/French feature-string parity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          files = [
              "home_verse_strings.dart",
              "learn_catalog_strings.dart",
              "prayer_notification_strings.dart",
              "reader_audio_transport_strings.dart",
              "reader_media_strings.dart",
              "reader_navigation_strings.dart",
              "reader_note_strings.dart",
              "home_quick_action_strings.dart",
              "home_recent_reading_strings.dart",
              "prayer_notification_diagnostics_strings.dart",
              "learn_reference_strings.dart",
              "learn_strings.dart",
          ]
          root = Path("lib/src/l10n/strings")
          def block(text, lang):
              marker = f"'{lang}': <String, String>{{"
              start = text.find(marker)
              assert start >= 0, f"missing {lang} block"
              candidates = []
              for other in ("tr","en","ar","az","ru","fr"):
                  if other == lang:
                      continue
                  i = text.find(f"'{other}': <String, String>{{", start + len(marker))
                  if i >= 0:
                      candidates.append(i)
              end = min(candidates) if candidates else text.rfind("};")
              return text[start:end]
          def keys(text, lang):
              return set(re.findall(r"^\s*'([^']+)'\s*:", block(text, lang), re.M))
          for name in files:
              text = (root / name).read_text(encoding="utf-8")
              en = keys(text, "en")
              fr = keys(text, "fr")
              assert en == fr, f"{name}: missing={sorted(en-fr)} extra={sorted(fr-en)}"
              assert en, f"{name}: empty key set"
              print(f"{name}: {len(fr)} French keys OK")
          PY
