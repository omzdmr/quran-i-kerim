name: French Plans parity validation

on:
  push:
    branches: [ manual/french-plans-feature-strings ]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Format Plans localization
        run: |
          dart format \
            lib/src/l10n/strings/plan_strings.dart \
            test/plan_strings_test.dart

      - name: Persist formatter output
        run: |
          if git diff --quiet -- lib/src/l10n/strings/plan_strings.dart test/plan_strings_test.dart; then
            echo "Formatter made no changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib/src/l10n/strings/plan_strings.dart test/plan_strings_test.dart
            git commit -m "style: format French Plans strings [skip ci]"
            git push origin HEAD:manual/french-plans-feature-strings
          fi

      - name: Verify English French Plans parity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path("lib/src/l10n/strings/plan_strings.dart").read_text(encoding="utf-8")
          def block(lang):
              marker = f"'{lang}': <String, String>{{"
              start = text.find(marker)
              assert start >= 0, f"missing {lang}"
              indices = []
              for other in ("tr","en","ar","az","ru","fr"):
                  if other == lang:
                      continue
                  i = text.find(f"'{other}': <String, String>{{", start + len(marker))
                  if i >= 0:
                      indices.append(i)
              end = min(indices) if indices else text.rfind("};")
              return text[start + len(marker):end]
          def keys(lang):
              return set(re.findall(r"^\s*'([^']+)'\s*:", block(lang), re.M))
          en = keys("en")
          fr = keys("fr")
          assert en == fr, f"missing={sorted(en-fr)} extra={sorted(fr-en)}"
          assert len(fr) >= 140, len(fr)
          print(f"French Plans parity OK: {len(fr)} keys")
          PY
