name: Apply world location v11

on:
  push:
    branches: [ feature/localization-v01 ]
    paths:
      - '.github/workflows/apply-world-location-v11.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Apply integration patch
        run: python3 tool/apply_world_location_v11.py

      - name: Remove helper
        run: rm tool/apply_world_location_v11.py

      - name: Format Dart
        run: >-
          dart format
          lib/src/features/prayer
          lib/src/features/discover/discover_screen.dart
          lib/src/features/reader/quran_reader_screen.dart
          lib/src/l10n/strings/feature_strings.dart
          test/app_localizations_test.dart

      - name: Fetch bundled content
        run: python3 tool/fetch_content.py

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze lib --no-fatal-infos

      - name: Test localization and prayer core
        run: >-
          flutter test
          test/prayer_calculator_test.dart
          test/prayer_region_resolver_test.dart
          test/app_localizations_test.dart

      - name: Commit source changes
        run: |
          git config user.name 'omzdmr'
          git config user.email '154471764+omzdmr@users.noreply.github.com'
          git add -A lib test tool pubspec.lock
          git commit -m 'Integrate worldwide location and Qibla UX'
          git push
