name: iOS Native Contract

on:
  push:
    branches: [ automation/ios-parity ]
    paths: [ 'ios/**', '.github/workflows/ios-native-contract.yml' ]
  workflow_dispatch:

concurrency:
  group: ios-native-contract-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  native-contract:
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate Xcode graph privacy and native localization
        run: |
          python3 ios/NativeTests/validate_project_graph.py
          python3 ios/NativeTests/validate_widget_localizations.py
          python3 ios/NativeTests/validate_widget_prayer_names.py
          python3 ios/NativeTests/validate_widget_snapshot_parity.py
          python3 ios/NativeTests/validate_lifecycle_restore.py
          python3 ios/NativeTests/validate_document_handoff.py
          python3 ios/NativeTests/validate_recording_storage.py
          python3 ios/NativeTests/validate_native_handoff.py
          python3 ios/NativeTests/validate_icloud_foundation.py
          python3 ios/NativeTests/validate_audio_recovery.py
          python3 ios/NativeTests/validate_audio_ownership.py
          python3 ios/NativeTests/validate_multiscene_lifecycle.py
          grep -q 'iCloud.com.omzdmr.quranIKerim' ios/Runner/Runner.entitlements
          grep -q 'CloudDocuments' ios/Runner/Runner.entitlements
          grep -q 'CloudBackupFoundation.swift in Sources' ios/Runner.xcodeproj/project.pbxproj
          grep -q 'CloudBackupFoundationChannel.swift in Sources' ios/Runner.xcodeproj/project.pbxproj
          plutil -lint ios/Runner/Info.plist
          plutil -lint ios/Runner/PrivacyInfo.xcprivacy
          plutil -lint ios/PrayerWidget/Info.plist
          plutil -lint ios/PrayerWidget/PrivacyInfo.xcprivacy
          plutil -lint ios/Runner/Runner.entitlements
          plutil -lint ios/PrayerWidget/PrayerWidget.entitlements
          grep -q '<string>quranikerim</string>' ios/Runner/Info.plist
          grep -q 'PrivacyInfo.xcprivacy in Resources' ios/Runner.xcodeproj/project.pbxproj
          test "$(grep -o 'IPHONEOS_DEPLOYMENT_TARGET = 16.0' ios/Runner.xcodeproj/project.pbxproj | wc -l | tr -d ' ')" -eq 3
      - name: Validate native parity contracts
        run: |
          grep -q '"universalLink": false' ios/Runner/AppDelegate.swift
          grep -q 'components.host == "prayer"' ios/Runner/AppDelegate.swift
          grep -q 'maxImportBytes: Int64 = 64' ios/Runner/AppDelegate.swift
          grep -q 'maxExportBytes: Int64 = 64' ios/Runner/AppDelegate.swift
          grep -q 'deleteImportedFile' ios/Runner/AppDelegate.swift
          grep -q 'activePresenterResolution": true' ios/Runner/AppDelegate.swift
          grep -q 'activeSceneAware": true' ios/Runner/AppDelegate.swift
          grep -q 'FileProtectionType.completeUntilFirstUserAuthentication' ios/Runner/AppDelegate.swift
          grep -q 'NotificationPermissionChannel.selfTestIdentifier' ios/Runner/AppDelegate.swift
          grep -q 'completionHandler(\[.banner, .sound\])' ios/Runner/AppDelegate.swift
          grep -q 'orientationAwareHeading": true' ios/Runner/BackupExclusionChannel.swift
          grep -q 'trueNorthWhenAuthorized": true' ios/Runner/BackupExclusionChannel.swift
          grep -q 'headingNeedsTrueNorth' ios/Runner/BackupExclusionChannel.swift
          grep -q 'headingOrientation = .landscapeLeft' ios/Runner/BackupExclusionChannel.swift
          grep -q 'canGoNext' ios/Runner/BackupExclusionChannel.swift
          grep -q 'bluetoothMicrophone": true' ios/Runner/MicrophoneRecordingChannel.swift
          grep -q 'inputChangeStopsRecording": true' ios/Runner/MicrophoneRecordingChannel.swift
          grep -q '\.allowBluetooth' ios/Runner/MicrophoneRecordingChannel.swift
          grep -q 'protectedDataAvailability": true' ios/Runner/NativeLifecycleStateChannel.swift
          grep -q 'systemLocaleEvents": true' ios/Runner/NativeLifecycleStateChannel.swift
          grep -q 'protectedDataDidBecomeAvailableNotification' ios/Runner/NativeLifecycleStateChannel.swift
          grep -q 'targetedWidgetReload": true' ios/Runner/NativeLifecycleStateChannel.swift
          grep -q 'reloadTimelines(ofKind: Self.prayerWidgetKind)' ios/Runner/NativeLifecycleStateChannel.swift
          grep -q 'backgroundEvictionDetection": true' ios/Runner/NativeLifecycleStateChannel.swift
          grep -q 'previousLifecycleState' ios/Runner/NativeLifecycleStateChannel.swift
          grep -q 'likelyBackgroundEviction' ios/Runner/NativeLifecycleStateChannel.swift
          grep -q 'recordLifecycleState("background")' ios/Runner/NativeLifecycleStateChannel.swift
          grep -q 'ownsNowPlayingInfo' ios/Runner/AudioSessionCoordinator.swift
          grep -q 'CODE_SIGN_ENTITLEMENTS = Runner/Runner.entitlements' ios/Runner.xcodeproj/project.pbxproj
          grep -q 'corruptPayloadQuarantine": true' ios/Runner/WidgetSnapshotChannel.swift
          grep -q 'invalidationDiagnostics": true' ios/Runner/WidgetSnapshotChannel.swift
          grep -q 'targetedTimelineReload": true' ios/Runner/WidgetSnapshotChannel.swift
          grep -q 'reloadTimelines(ofKind: Self.widgetKind)' ios/Runner/WidgetSnapshotChannel.swift
          grep -q 'maxShareFileBytes: Int64 = 64' ios/Runner/NativeShareChannel.swift
          grep -q 'copyOnShare": true' ios/Runner/NativeShareChannel.swift
          grep -q 'preservesFilename": true' ios/Runner/NativeShareChannel.swift
          grep -q 'isolatedShareSession": true' ios/Runner/NativeShareChannel.swift
          grep -q 'activeSceneAware": true' ios/Runner/NativeShareChannel.swift
          grep -q 'lifecycleCleanup": true' ios/Runner/NativeShareChannel.swift
          grep -q 'createProtectedBackupExcludedDirectory(session)' ios/Runner/NativeShareChannel.swift
          grep -q 'backupExcludedStaging": true' ios/Runner/NativeShareChannel.swift
          grep -q 'orphanCleanup": true' ios/Runner/NativeShareChannel.swift
          grep -q 'orphanLifetime: TimeInterval = 24' ios/Runner/NativeShareChannel.swift
          grep -q 'cleanupOrphanedStaging()' ios/Runner/NativeShareChannel.swift
          grep -q 'FileProtectionType.completeUntilFirstUserAuthentication' ios/Runner/NativeShareChannel.swift
          grep -q 'isExcludedFromBackup = true' ios/Runner/NativeShareChannel.swift
          grep -q 'removeItem(at: stagedShareURL.deletingLastPathComponent())' ios/Runner/NativeShareChannel.swift
          grep -q 'payloadKey = "widget.prayer.snapshot.v1"' ios/PrayerWidget/PrayerWidget.swift
          grep -q 'timeZoneIdentifier == currentTimeZone.identifier' ios/PrayerWidget/PrayerWidget.swift
          grep -q 'snapshot.isRedacted' ios/PrayerWidget/PrayerWidget.swift
          grep -q 'family == .systemLarge' ios/PrayerWidget/PrayerWidget.swift
          grep -q 'family == .systemExtraLarge' ios/PrayerWidget/PrayerWidget.swift
          grep -q '\.systemExtraLarge' ios/PrayerWidget/PrayerWidget.swift
      - name: Type-check WidgetKit iOS 16 surface
        run: xcrun --sdk iphonesimulator swiftc -parse-as-library -target arm64-apple-ios16.0-simulator -typecheck ios/PrayerWidget/PrayerWidget.swift
      - name: Build and inspect standalone WidgetKit extension
        run: |
          rm -rf /tmp/quran-widget-build
          xcodebuild -project ios/Runner.xcodeproj -target PrayerWidget -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO CONFIGURATION_BUILD_DIR=/tmp/quran-widget-build FLUTTER_BUILD_NAME=0.0.0 FLUTTER_BUILD_NUMBER=1 build
          widget=/tmp/quran-widget-build/PrayerWidget.appex
          test -d "$widget"
          test -f "$widget/PrivacyInfo.xcprivacy"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$widget/Info.plist" | grep -qx com.omzdmr.quranIKerim.PrayerWidget
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$widget/Info.plist" | grep -qx 0.0.0
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$widget/Info.plist" | grep -qx 1
          /usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPointIdentifier' "$widget/Info.plist" | grep -qx com.apple.widgetkit-extension
          for locale in en tr ar az ru fr; do test -f "$widget/${locale}.lproj/Localizable.strings"; done
      - name: Type-check MediaPlayer native surface
        run: xcrun --sdk iphonesimulator swiftc -parse-as-library -target arm64-apple-ios15.0-simulator -typecheck ios/Runner/AudioSessionCoordinator.swift
      - name: Validate backup exclusion contract
        run: |
          swiftc ios/Runner/BackupExclusionCoordinator.swift ios/NativeTests/BackupExclusionCoordinatorValidation.swift -o /tmp/backup-exclusion-validation
          /tmp/backup-exclusion-validation
      - name: Validate snapshot persistence contract
        run: |
          swiftc ios/Runner/WidgetSnapshotStore.swift ios/NativeTests/WidgetSnapshotValidation.swift -o /tmp/widget-snapshot-validation
          /tmp/widget-snapshot-validation

      - name: Validate iCloud backup foundation
        run: |
          swiftc ios/Runner/CloudBackupFoundation.swift ios/NativeTests/CloudBackupFoundationValidation.swift -o /tmp/cloud-backup-foundation-validation
          /tmp/cloud-backup-foundation-validation
