name: Apply Audio v2.1 completion

on:
  push:
    branches: [ feature/localization-v01 ]
    paths:
      - '.github/workflows/apply-audio-v21-completion.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: feature/localization-v01
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "omzdmr"
          git config user.email "154471764+omzdmr@users.noreply.github.com"

      - name: Apply Audio v2.1 completion
        run: python3 tool/apply_audio_v21_completion.py
