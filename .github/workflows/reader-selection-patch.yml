name: Apply reader selection UX patch

on:
  push:
    branches: [ feature/reader-ux-v04 ]
    paths:
      - tool/patch_reader_selection_v06.py
      - .github/workflows/reader-selection-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply deterministic reader patch
        run: python3 tool/patch_reader_selection_v06.py

      - name: Commit patched reader
        run: |
          if git diff --quiet -- lib/src/features/reader/quran_reader_screen.dart; then
            echo "Reader already patched."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/src/features/reader/quran_reader_screen.dart
          git commit -m "Compact reader selection actions"
          git push
