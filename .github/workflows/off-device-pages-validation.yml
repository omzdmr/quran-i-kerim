name: Off-device Pages Validation

on:
  push:
    branches:
      - manual/off-device-page-sessions

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Fetch bundled content
        run: python3 tool/fetch_content.py

      - name: Get dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Format changed code
        run: |
          dart format \
            lib/src/features/plans/reading_plan.dart \
            lib/src/features/plans/reading_plan_store.dart \
            lib/src/features/plans/plans_screen.dart \
            lib/src/l10n/strings/plan_strings.dart \
            test/reading_plan_store_test.dart

      - name: Persist formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/src/features/plans/reading_plan.dart \
            lib/src/features/plans/reading_plan_store.dart \
            lib/src/features/plans/plans_screen.dart \
            lib/src/l10n/strings/plan_strings.dart \
            test/reading_plan_store_test.dart
          if ! git diff --cached --quiet; then
            git commit -m "style: format off-device page sessions"
            git push
          fi

      - name: Test reading plan store
        run: timeout 120s flutter test test/reading_plan_store_test.dart --reporter expanded

      - name: Test plan localization parity
        run: timeout 90s flutter test test/plan_strings_test.dart --reporter expanded
