name: Off-device structured reading validation

on:
  push:
    branches: [ manual/off-device-juz-ayah ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Fetch and validate bundled content
        run: python3 tool/fetch_content.py

      - name: Get dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Format changed files
        run: |
          dart format \
            lib/src/features/plans/reading_plan.dart \
            lib/src/features/plans/reading_plan_store.dart \
            lib/src/features/plans/plans_screen.dart \
            lib/src/l10n/strings/plan_strings.dart \
            test/reading_plan_store_test.dart

      - name: Persist formatter output
        run: |
          TARGETS=(
            lib/src/features/plans/reading_plan.dart
            lib/src/features/plans/reading_plan_store.dart
            lib/src/features/plans/plans_screen.dart
            lib/src/l10n/strings/plan_strings.dart
            test/reading_plan_store_test.dart
          )
          if git diff --quiet -- "${TARGETS[@]}"; then
            echo "Formatter made no target-file changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            lib/src/features/plans/reading_plan.dart \
            lib/src/features/plans/reading_plan_store.dart \
            lib/src/features/plans/plans_screen.dart \
            lib/src/l10n/strings/plan_strings.dart \
            test/reading_plan_store_test.dart
          git commit -m "style: format structured off-device reading"
          git push origin HEAD:manual/off-device-juz-ayah

      - name: Run reading-plan store tests
        run: timeout 180s flutter test test/reading_plan_store_test.dart --reporter expanded

      - name: Run plan localization parity test
        run: timeout 120s flutter test test/plan_strings_test.dart --reporter expanded

      - name: Compile Plans screen import
        run: |
          cat > test/_plans_structured_compile_test.dart <<'DART'
          import 'package:flutter_test/flutter_test.dart';
          import 'package:quran_i_kerim/src/features/plans/plans_screen.dart';

          void main() {
            test('PlansScreen compiles', () {
              expect(const PlansScreen(), isA<PlansScreen>());
            });
          }
          DART
          timeout 120s flutter test test/_plans_structured_compile_test.dart --reporter expanded
