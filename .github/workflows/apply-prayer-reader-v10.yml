name: Apply prayer reader v10

on:
  push:
    branches: [ feature/localization-v01 ]
    paths:
      - '.github/workflows/apply-prayer-reader-v10.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/localization-v01
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Apply patch
        run: python3 tool/apply_prayer_reader_v10.py

      - name: Format changed Dart
        run: >-
          dart format
          lib/src/features/prayer/presentation/prayer_screen.dart
          lib/src/features/reader/reader_audio_sheet.dart
          lib/src/features/reader/quran_reader_screen.dart
          lib/src/l10n/strings/feature_strings.dart

      - name: Commit source changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            lib/src/features/prayer/presentation/prayer_screen.dart \
            lib/src/features/reader/reader_audio_sheet.dart \
            lib/src/features/reader/quran_reader_screen.dart \
            lib/src/l10n/strings/feature_strings.dart
          git commit -m 'Add GPS prayer tools and smooth reader chrome'
          git push origin HEAD:feature/localization-v01
