name: Apply Home prayer v07 patch

on:
  push:
    branches: [ feature/reader-ux-v04 ]
    paths:
      - tool/patch_home_prayer_v07.py
      - .github/workflows/home-prayer-v07-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Home prayer card patch
        run: python3 tool/patch_home_prayer_v07.py

      - name: Commit patched Home screen
        run: |
          if git diff --quiet -- lib/src/features/home/home_screen.dart; then
            echo "Home screen already patched."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/src/features/home/home_screen.dart
          git commit -m "Show next prayer on Home"
          git push
