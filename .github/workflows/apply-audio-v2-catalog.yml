name: Apply Audio v2 catalog
# corrected Azeri catalog patch with bundled content validation

on:
  push:
    branches: [ feature/localization-v01 ]
    paths:
      - '.github/workflows/apply-audio-v2-catalog.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Add Azeri spoken translation
        run: python3 tool/add_azeri_audio_v2.py

      - name: Remove helper
        run: rm tool/add_azeri_audio_v2.py

      - name: Format
        run: dart format lib/src/data/quran_audio_catalog.dart lib/src/data/translation_catalog.dart test/translation_catalog_test.dart

      - name: Fetch bundled content
        run: python3 tool/fetch_content.py

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze lib --no-fatal-infos

      - name: Test Audio v2 catalog
        run: flutter test test/translation_catalog_test.dart

      - name: Commit source changes
        run: |
          git config user.name 'omzdmr'
          git config user.email '154471764+omzdmr@users.noreply.github.com'
          git add lib/src/data/quran_audio_catalog.dart lib/src/data/translation_catalog.dart test/translation_catalog_test.dart
          git commit -m 'Add QuranEnc Azeri spoken translation'
          git push
