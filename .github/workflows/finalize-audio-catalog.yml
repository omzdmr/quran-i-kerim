name: Finalize verified audio catalog

on:
  push:
    branches: [ feature/localization-v01 ]
    paths:
      - '.github/workflows/finalize-audio-catalog.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: feature/localization-v01
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "omzdmr"
          git config user.email "154471764+omzdmr@users.noreply.github.com"

      - name: Finalize verified audio catalog
        run: python3 tool/finalize_audio_catalog.py
