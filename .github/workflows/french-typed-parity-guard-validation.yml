name: French typed parity guard validation

on:
  push:
    branches: [ manual/french-typed-parity-guard ]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Fetch and validate bundled content
        run: python3 tool/fetch_content.py

      - name: Get dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Check test formatting
        run: dart format --output=none --set-exit-if-changed test/french_typed_string_parity_test.dart

      - name: Run French typed parity guard
        run: timeout 180s flutter test test/french_typed_string_parity_test.dart --reporter expanded
