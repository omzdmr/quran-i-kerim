name: One-off reader and home UX patch

on:
  push:
    branches: [ feature/localization-v01 ]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Apply reader language and chrome fixes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/localization-v01
          fetch-depth: 0

      - name: Apply focused source patches
        shell: python
        run: |
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              return text.replace(old, new, 1)

          reader_path = Path('lib/src/features/reader/quran_reader_screen.dart')
          reader = reader_path.read_text(encoding='utf-8')

          reader = replace_once(
              reader,
              "  bool _didRestorePosition = false;\n  final Set<int> _selectedAyahs = <int>{};",
              "  bool _didRestorePosition = false;\n  bool _readerChromeVisible = true;\n  final Set<int> _selectedAyahs = <int>{};",
              'reader chrome state',
          )

          reader = replace_once(
              reader,
              "  String _surahName(SurahInfo surah) =>\n      Localizations.localeOf(context).languageCode == 'ar'\n          ? surah.nameAr\n          : surah.nameTr;",
              "  String _readerLanguageCode() {\n    final settings = AppSettingsScope.of(context);\n    if (settings.readerUsesArabic) return 'ar';\n    return translationById(settings.selectedQuranSourceId)?.languageCode ??\n        Localizations.localeOf(context).languageCode;\n  }\n\n  String _surahName(SurahInfo surah) => switch (_readerLanguageCode()) {\n        'ar' => quran.getSurahNameArabic(surah.number),\n        'tr' => quran.getSurahNameTurkish(surah.number),\n        'ru' => quran.getSurahNameRussian(surah.number),\n        _ => quran.getSurahNameEnglish(surah.number),\n      };",
              'reader surah language',
          )

          reader = replace_once(
              reader,
              "              Padding(\n                padding: const EdgeInsets.fromLTRB(16, 12, 10, 8),",
              "              AnimatedSize(\n                duration: const Duration(milliseconds: 180),\n                curve: Curves.easeOutCubic,\n                child: (_readerChromeVisible || _selectedAyahs.isNotEmpty)\n                    ? Column(\n                        children: [\n                          Padding(\n                padding: const EdgeInsets.fromLTRB(16, 12, 10, 8),",
              'reader chrome wrapper start',
          )

          reader = replace_once(
              reader,
              "              const Divider(height: 1),\n              Expanded(",
              "                          const Divider(height: 1),\n                        ],\n                      )\n                    : const SizedBox.shrink(),\n              ),\n              Expanded(",
              'reader chrome wrapper end',
          )

          reader = replace_once(
              reader,
              "      onNotification: (notification) {\n        if (notification is ScrollEndNotification) {\n          _saveVisibleReadingPosition();\n        }\n        return false;\n      },\n      child: SingleChildScrollView(",
              "      onNotification: (notification) {\n        if (notification is UserScrollNotification &&\n            _selectedAyahs.isEmpty) {\n          var shouldShow = notification.direction != ScrollDirection.reverse;\n          if (_scrollController.hasClients && _scrollController.offset < 18) {\n            shouldShow = true;\n          }\n          if (shouldShow != _readerChromeVisible) {\n            WidgetsBinding.instance.addPostFrameCallback((_) {\n              if (!mounted || _selectedAyahs.isNotEmpty) return;\n              if (_readerChromeVisible != shouldShow) {\n                setState(() => _readerChromeVisible = shouldShow);\n              }\n            });\n          }\n        }\n        if (notification is ScrollEndNotification) {\n          _saveVisibleReadingPosition();\n        }\n        return false;\n      },\n      child: GestureDetector(\n        behavior: HitTestBehavior.translucent,\n        onHorizontalDragEnd: _handleHorizontalReaderSwipe,\n        child: SingleChildScrollView(",
              'reader scroll behavior',
          )

          reader = replace_once(
              reader,
              "          ],\n        ),\n      ),\n    );\n  }\n\n  void _saveVisibleReadingPosition() {",
              "          ],\n        ),\n      ),\n      ),\n    );\n  }\n\n  void _handleHorizontalReaderSwipe(DragEndDetails details) {\n    if (_selectedAyahs.isNotEmpty) return;\n    final velocity = details.primaryVelocity ?? 0;\n    if (velocity.abs() < 450) return;\n    if (velocity < 0 && _surahNumber < 114) {\n      _openSurahAtStart(_surahNumber + 1);\n    } else if (velocity > 0 && _surahNumber > 1) {\n      _openSurahAtStart(_surahNumber - 1);\n    }\n  }\n\n  void _saveVisibleReadingPosition() {",
              'reader swipe close/helper',
          )

          reader = replace_once(
              reader,
              "              final normalized = query.trim().toLowerCase();\n              final filtered = normalized.isEmpty\n                  ? surahCatalog\n                  : surahCatalog.where((surah) {\n                      return surah.nameTr.toLowerCase().contains(normalized) ||\n                          surah.nameAr.contains(normalized) ||\n                          surah.number.toString() == normalized;\n                    }).toList(growable: false);",
              "              final normalized = query.trim().toLowerCase();\n              final filtered = normalized.isEmpty\n                  ? surahCatalog\n                  : surahCatalog.where((surah) {\n                      final currentName = _surahName(surah).toLowerCase();\n                      return currentName.contains(normalized) ||\n                          quran.getSurahNameEnglish(surah.number)\n                              .toLowerCase()\n                              .contains(normalized) ||\n                          quran.getSurahNameTurkish(surah.number)\n                              .toLowerCase()\n                              .contains(normalized) ||\n                          quran.getSurahNameRussian(surah.number)\n                              .toLowerCase()\n                              .contains(normalized) ||\n                          surah.nameAr.contains(normalized) ||\n                          surah.number.toString() == normalized;\n                    }).toList(growable: false);",
              'surah picker search language',
          )

          reader = replace_once(
              reader,
              "            alignment: PlaceholderAlignment.middle,\n            child: GestureDetector(\n              behavior: HitTestBehavior.opaque,\n              onTap: () => widget.onNoteTap(ayah),\n              child: Padding(\n                padding: const EdgeInsets.symmetric(horizontal: 4, vertical: 5),\n                child: Icon(\n                  Icons.comment_outlined,",
              "            alignment: PlaceholderAlignment.baseline,\n            baseline: TextBaseline.alphabetic,\n            child: GestureDetector(\n              behavior: HitTestBehavior.opaque,\n              onTap: () => widget.onNoteTap(ayah),\n              child: Padding(\n                padding: const EdgeInsets.symmetric(horizontal: 4),\n                child: Icon(\n                  Icons.note_alt_outlined,",
              'personal note marker',
          )

          reader = replace_once(
              reader,
              "    final scheme = Theme.of(context).colorScheme;\n    final arabicUi = Localizations.localeOf(context).languageCode == 'ar';\n    return Material(",
              "    final scheme = Theme.of(context).colorScheme;\n    final settings = AppSettingsScope.of(context);\n    final languageCode = settings.readerUsesArabic\n        ? 'ar'\n        : translationById(settings.selectedQuranSourceId)?.languageCode ??\n            Localizations.localeOf(context).languageCode;\n    final displayName = switch (languageCode) {\n      'ar' => quran.getSurahNameArabic(surah.number),\n      'tr' => quran.getSurahNameTurkish(surah.number),\n      'ru' => quran.getSurahNameRussian(surah.number),\n      _ => quran.getSurahNameEnglish(surah.number),\n    };\n    return Material(",
              'surah row language state',
          )

          reader = replace_once(
              reader,
              "        title: Text(\n          arabicUi ? surah.nameAr : surah.nameTr,",
              "        title: Text(\n          displayName,",
              'surah row title',
          )

          reader = replace_once(
              reader,
              "        trailing: arabicUi\n            ? null",
              "        trailing: languageCode == 'ar'\n            ? null",
              'surah row trailing',
          )

          reader_path.write_text(reader, encoding='utf-8')

          home_path = Path('lib/src/features/home/home_screen.dart')
          home = home_path.read_text(encoding='utf-8')

          home = replace_once(
              home,
              "  Future<String?> _selectedTranslationVerse(AppSettings settings) async {\n    if (settings.readerUsesArabic) return null;\n    final verses = await TranslationRepository.instance\n        .loadSourceVerses(settings.selectedQuranSourceId);\n    return verses['${widget.reference.$1}:${widget.reference.$2}'];\n  }",
              "  Future<String?> _preferredTranslationVerse(String languageCode) async {\n    final sourceId = defaultQuranSourceForLanguage(languageCode);\n    if (sourceId == arabicOriginalSourceId) return null;\n    final verses =\n        await TranslationRepository.instance.loadSourceVerses(sourceId);\n    return verses['${widget.reference.$1}:${widget.reference.$2}'];\n  }\n\n  String _surahNameForLanguage(int surahNumber, String languageCode) =>\n      switch (languageCode) {\n        'ar' => quran.getSurahNameArabic(surahNumber),\n        'tr' => quran.getSurahNameTurkish(surahNumber),\n        'ru' => quran.getSurahNameRussian(surahNumber),\n        _ => quran.getSurahNameEnglish(surahNumber),\n      };",
              'home preferred translation function',
          )

          home = replace_once(
              home,
              "    final settings = AppSettingsScope.of(context);\n    final translation = translationById(settings.selectedQuranSourceId);\n    final sourceCode = settings.readerUsesArabic ? 'AR' : translation?.code ?? 'RWD';\n    final l10n = context.l10n;\n    final languageCode = l10n.locale.languageCode;",
              "    final settings = AppSettingsScope.of(context);\n    final l10n = context.l10n;\n    final languageCode = l10n.locale.languageCode;\n    final homeSourceId = defaultQuranSourceForLanguage(languageCode);\n    final translation = translationById(homeSourceId);\n    final sourceCode =\n        homeSourceId == arabicOriginalSourceId ? 'AR' : translation?.code ?? 'RWD';",
              'home source selection',
          )

          home = replace_once(
              home,
              "                          '${surah.nameTr} ${reference.$1}:${reference.$2} · $sourceCode',",
              "                          '${_surahNameForLanguage(surah.number, languageCode)} ${reference.$1}:${reference.$2} · $sourceCode',",
              'home surah label language',
          )

          home = replace_once(
              home,
              "              if (!settings.readerUsesArabic) ...[",
              "              if (homeSourceId != arabicOriginalSourceId) ...[",
              'home translation visibility',
          )

          home = replace_once(
              home,
              "                  future: _selectedTranslationVerse(settings),",
              "                  future: _preferredTranslationVerse(languageCode),",
              'home translation future',
          )

          home_path.write_text(home, encoding='utf-8')

          catalog_path = Path('lib/src/data/translation_catalog.dart')
          catalog = catalog_path.read_text(encoding='utf-8')
          catalog = replace_once(
              catalog,
              "    'tr' => bundledTurkishTranslationId,\n    _ => bundledTurkishTranslationId,",
              "    'tr' => bundledTurkishTranslationId,\n    _ => englishTranslationId,",
              'default translation fallback',
          )
          catalog_path.write_text(catalog, encoding='utf-8')

      - name: Validate patch
        run: |
          git diff --check
          git diff --stat
          test -n "$(git status --porcelain)"

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/src/features/reader/quran_reader_screen.dart lib/src/features/home/home_screen.dart lib/src/data/translation_catalog.dart
          git commit -m "Apply reader language and chrome fixes"
          git push origin HEAD:feature/localization-v01
