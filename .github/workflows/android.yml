name: Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Generate Android scaffold
        run: flutter create --platforms=android --org com.omzdmr --project-name quran_i_kerim .

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set Android app label
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/app/src/main/AndroidManifest.xml')
          text = path.read_text(encoding='utf-8')
          text = text.replace('android:label="quran_i_kerim"', 'android:label="Kur’an-ı Kerim"')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Fetch bundled Turkish meal
        run: |
          mkdir -p assets/data/translations
          curl --fail --location --retry 3 \
            --output assets/data/translations/tr_rwwad.json.gz \
            https://raw.githubusercontent.com/Yi-Developer/Qurb-content/6c0a1571bcac95eaaf0d167d15e558ec3c2bb8e2/quran/translations/t_turkish_rwwad.json.gz
          python3 - <<'PY'
          import gzip, json
          from pathlib import Path
          path = Path('assets/data/translations/tr_rwwad.json.gz')
          with gzip.open(path, 'rt', encoding='utf-8') as f:
              data = json.load(f)
          if len(data) != 6236:
              raise SystemExit(f'Expected 6236 translated ayahs, got {len(data)}')
          for key in ('1:1', '2:255', '114:6'):
              if not data.get(key):
                  raise SystemExit(f'Missing required verse: {key}')
          print(f'Turkish meal verified: {len(data)} ayahs, {path.stat().st_size} compressed bytes')
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze app code
        run: flutter analyze lib --no-fatal-infos

      - name: Build lightweight APKs
        run: flutter build apk --release --split-per-abi

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: quran-i-kerim-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14
