name: Android APK

on:
  push:
    branches: [ main, feature/localization-v01 ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Generate Android scaffold
        run: flutter create --platforms=android --org com.omzdmr --project-name quran_i_kerim .

      - name: Remove generated scaffold test
        run: |
          if ! git ls-files --error-unmatch test/widget_test.dart >/dev/null 2>&1; then
            rm -f test/widget_test.dart
          fi

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Restore fixed non-production test signing key
        run: |
          mkdir -p .ci
          base64 --decode .ci/NON_PRODUCTION_TEST_SIGNING_KEY.b64 > .ci/test-signing.jks
          chmod 600 .ci/test-signing.jks

      - name: Verify stable test signing certificate
        run: |
          fingerprint="$(keytool -list -v \
            -keystore .ci/test-signing.jks \
            -storepass android \
            -alias quran_test | sed -n 's/.*SHA256: //p')"
          echo "Test certificate SHA256: $fingerprint"
          test "$fingerprint" = "B4:3E:F1:1A:40:8E:65:C3:CE:42:73:8D:6D:44:94:2A:F2:CB:78:78:04:23:CE:E6:4B:78:2A:8C:79:36:AE:5C"

      - name: Configure stable test signing
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('android/app/build.gradle.kts')
          text = path.read_text(encoding='utf-8')

          marker = '    buildTypes {'
          signing = '''    signingConfigs {
              create("testRelease") {
                  storeFile = rootProject.file("../.ci/test-signing.jks")
                  storePassword = "android"
                  keyAlias = "quran_test"
                  keyPassword = "android"
              }
          }

          '''
          if marker not in text:
              raise SystemExit('buildTypes marker not found')
          text = text.replace(marker, signing + marker, 1)
          text = text.replace(
              'signingConfig = signingConfigs.getByName("debug")',
              'signingConfig = signingConfigs.getByName("testRelease")',
              1,
          )
          if 'getByName("testRelease")' not in text:
              raise SystemExit('release signing config was not patched')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Configure Android manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/app/src/main/AndroidManifest.xml')
          text = path.read_text(encoding='utf-8')
          text = text.replace('android:label="quran_i_kerim"', 'android:label="Kur’an-ı Kerim"')
          permissions = [
              'android.permission.INTERNET',
              'android.permission.ACCESS_COARSE_LOCATION',
              'android.permission.ACCESS_FINE_LOCATION',
              'android.permission.RECORD_AUDIO',
              'android.permission.POST_NOTIFICATIONS',
              'android.permission.RECEIVE_BOOT_COMPLETED',
              'android.permission.SCHEDULE_EXACT_ALARM',
              'android.permission.WAKE_LOCK',
              'android.permission.FOREGROUND_SERVICE',
              'android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK',
          ]
          for name in permissions:
              permission = f'<uses-permission android:name="{name}" />'
              if permission not in text:
                  text = text.replace('<application', f'{permission}\n    <application', 1)

          receivers = '''
              <receiver
                  android:exported="false"
                  android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />
              <receiver
                  android:exported="false"
                  android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">
                  <intent-filter>
                      <action android:name="android.intent.action.BOOT_COMPLETED" />
                      <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />
                      <action android:name="android.intent.action.QUICKBOOT_POWERON" />
                      <action android:name="com.htc.intent.action.QUICKBOOT_POWERON" />
                  </intent-filter>
              </receiver>
          '''
          if 'ScheduledNotificationReceiver' not in text:
              text = text.replace('</application>', receivers + '\n    </application>', 1)

          audio_service = '''
              <service
                  android:name="com.ryanheise.audioservice.AudioService"
                  android:foregroundServiceType="mediaPlayback"
                  android:exported="true">
                  <intent-filter>
                      <action android:name="android.media.browse.MediaBrowserService" />
                  </intent-filter>
              </service>
              <receiver
                  android:name="com.ryanheise.audioservice.MediaButtonReceiver"
                  android:exported="true">
                  <intent-filter>
                      <action android:name="android.intent.action.MEDIA_BUTTON" />
                  </intent-filter>
              </receiver>
          '''
          if 'com.ryanheise.audioservice.AudioService' not in text:
              text = text.replace('</application>', audio_service + '\n    </application>', 1)
          path.write_text(text, encoding='utf-8')

          activity = Path('android/app/src/main/kotlin/com/omzdmr/quran_i_kerim/MainActivity.kt')
          activity.write_text(
              'package com.omzdmr.quran_i_kerim\n\n'
              'import com.ryanheise.audioservice.AudioServiceActivity\n\n'
              'class MainActivity : AudioServiceActivity()\n',
              encoding='utf-8',
          )
          PY

      - name: Configure Android recording support
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/app/build.gradle.kts')
          text = path.read_text(encoding='utf-8')
          marker = 'minSdk = flutter.minSdkVersion'
          if marker in text:
              text = text.replace(marker, 'minSdk = 23', 1)
          elif 'minSdk = 23' not in text:
              raise SystemExit('Android minSdk marker not found')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Configure media notification resources
        run: |
          mkdir -p android/app/src/main/res/drawable android/app/src/main/res/raw
          cat > android/app/src/main/res/drawable/ic_stat_quran.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#FFFFFFFF"
                  android:pathData="M3,4.5C3,3.67 3.67,3 4.5,3H10C11.1,3 12,3.9 12,5V20C12,18.9 11.1,18 10,18H3V4.5ZM21,4.5C21,3.67 20.33,3 19.5,3H14C12.9,3 12,3.9 12,5V20C12,18.9 12.9,18 14,18H21V4.5Z" />
          </vector>
          XML
          cat > android/app/src/main/res/raw/keep.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources xmlns:tools="http://schemas.android.com/tools"
              tools:keep="@drawable/ic_stat_quran" />
          XML

      - name: Configure Android notification desugaring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/app/build.gradle.kts')
          text = path.read_text(encoding='utf-8')
          marker = '    compileOptions {\n'
          if marker not in text:
              raise SystemExit('compileOptions marker not found')
          if 'isCoreLibraryDesugaringEnabled = true' not in text:
              text = text.replace(
                  marker,
                  marker + '        isCoreLibraryDesugaringEnabled = true\n',
                  1,
              )
          dependency = 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'
          if dependency not in text:
              text += f'''\n\ndependencies {{\n    {dependency}\n}}\n'''
          path.write_text(text, encoding='utf-8')
          PY

      - name: Fetch and validate bundled content
        run: python3 tool/fetch_content.py

      - name: Get dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Analyze app code
        run: flutter analyze lib --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Build ARM64 test APK
        run: |
          BUILD_NUMBER=$((100000 + GITHUB_RUN_NUMBER))
          echo "Building version 0.5.0 ($BUILD_NUMBER)"
          flutter build apk \
            --release \
            --target-platform android-arm64 \
            --build-name=0.5.0 \
            --build-number="$BUILD_NUMBER"

      - name: Verify APK signer and identity
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --print-certs "$APK" | tee /tmp/apk-signature.txt
          digest="$(sed -n 's/.*certificate SHA-256 digest: //p' /tmp/apk-signature.txt | head -1 | tr '[:upper:]' '[:lower:]')"
          test "$digest" = "b43ef11a408e65c3ce42738d6d44942af2cb78780423cee64b782a8c7936ae5c"
          grep -q 'applicationId = "com.omzdmr.quran_i_kerim"' android/app/build.gradle.kts

      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: quran-i-kerim-arm64-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
