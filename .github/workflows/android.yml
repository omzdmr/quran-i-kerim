name: Android APK

on:
  push:
    branches: [ main, feature/localization-v01 ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Generate Android scaffold
        run: flutter create --platforms=android --org com.omzdmr --project-name quran_i_kerim .

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Restore fixed non-production test signing key
        run: |
          mkdir -p .ci
          base64 --decode .ci/NON_PRODUCTION_TEST_SIGNING_KEY.b64 > .ci/test-signing.jks
          chmod 600 .ci/test-signing.jks

      - name: Verify stable test signing certificate
        run: |
          fingerprint="$(keytool -list -v \
            -keystore .ci/test-signing.jks \
            -storepass android \
            -alias quran_test | sed -n 's/.*SHA256: //p')"
          echo "Test certificate SHA256: $fingerprint"
          test "$fingerprint" = "B4:3E:F1:1A:40:8E:65:C3:CE:42:73:8D:6D:44:94:2A:F2:CB:78:78:04:23:CE:E6:4B:78:2A:8C:79:36:AE:5C"

      - name: Configure stable test signing
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('android/app/build.gradle.kts')
          text = path.read_text(encoding='utf-8')

          marker = '    buildTypes {'
          signing = '''    signingConfigs {
              create("testRelease") {
                  storeFile = rootProject.file("../.ci/test-signing.jks")
                  storePassword = "android"
                  keyAlias = "quran_test"
                  keyPassword = "android"
              }
          }

          '''
          if marker not in text:
              raise SystemExit('buildTypes marker not found')
          text = text.replace(marker, signing + marker, 1)
          text = text.replace(
              'signingConfig = signingConfigs.getByName("debug")',
              'signingConfig = signingConfigs.getByName("testRelease")',
              1,
          )
          if 'getByName("testRelease")' not in text:
              raise SystemExit('release signing config was not patched')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Configure Android manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/app/src/main/AndroidManifest.xml')
          text = path.read_text(encoding='utf-8')
          text = text.replace('android:label="quran_i_kerim"', 'android:label="Kur’an-ı Kerim"')
          permission = '<uses-permission android:name="android.permission.INTERNET" />'
          if permission not in text:
              text = text.replace('<application', f'{permission}\n    <application', 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Fetch and validate bundled content
        run: python3 tool/fetch_content.py

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze app code
        run: flutter analyze lib --no-fatal-infos

      - name: Run tests
        run: >-
          flutter test
          test/prayer_calculator_test.dart
          test/app_localizations_test.dart
          test/translation_repository_test.dart
          test/app_settings_source_test.dart
          test/translation_catalog_test.dart

      - name: Build ARM64 test APK
        run: |
          BUILD_NUMBER=$((100000 + GITHUB_RUN_NUMBER))
          echo "Building version 0.5.0 ($BUILD_NUMBER)"
          flutter build apk \
            --release \
            --target-platform android-arm64 \
            --build-name=0.5.0 \
            --build-number="$BUILD_NUMBER"

      - name: Verify APK signer and identity
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --print-certs "$APK" | tee /tmp/apk-signature.txt
          grep -q "B4:3E:F1:1A:40:8E:65:C3:CE:42:73:8D:6D:44:94:2A:F2:CB:78:78:04:23:CE:E6:4B:78:2A:8C:79:36:AE:5C" /tmp/apk-signature.txt
          grep -q 'applicationId = "com.omzdmr.quran_i_kerim"' android/app/build.gradle.kts

      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: quran-i-kerim-arm64-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
