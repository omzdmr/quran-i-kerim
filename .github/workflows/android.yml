name: Android APK

on:
  push:
    branches: [ main, feature/audio-v21 ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Generate Android scaffold
        run: |
          flutter create --platforms=android --org com.omzdmr --project-name quran_i_kerim .
          rm -f test/widget_test.dart

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Restore stable test signing key
        uses: actions/cache@v4
        with:
          path: .ci/test-signing.jks
          key: quran-i-kerim-arm64-test-signing-v2

      - name: Create stable test signing key if needed
        run: |
          mkdir -p .ci
          if [ ! -f .ci/test-signing.jks ]; then
            keytool -genkeypair \
              -keystore .ci/test-signing.jks \
              -storepass android \
              -alias quran_test \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Quran Test,O=omzdmr,C=TR"
          fi
          keytool -list -v \
            -keystore .ci/test-signing.jks \
            -storepass android \
            -alias quran_test | grep -E "SHA256:|Owner:|Valid from:"

      - name: Configure stable test signing
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('android/app/build.gradle.kts')
          text = path.read_text(encoding='utf-8')

          marker = '    buildTypes {'
          signing = '''    signingConfigs {
              create("testRelease") {
                  storeFile = rootProject.file("../.ci/test-signing.jks")
                  storePassword = "android"
                  keyAlias = "quran_test"
                  keyPassword = "android"
              }
          }

          '''
          if marker not in text:
              raise SystemExit('buildTypes marker not found')
          text = text.replace(marker, signing + marker, 1)
          text = text.replace(
              'signingConfig = signingConfigs.getByName("debug")',
              'signingConfig = signingConfigs.getByName("testRelease")',
              1,
          )
          if 'getByName("testRelease")' not in text:
              raise SystemExit('release signing config was not patched')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Set Android app label
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/app/src/main/AndroidManifest.xml')
          text = path.read_text(encoding='utf-8')
          text = text.replace('android:label="quran_i_kerim"', 'android:label="Kur’an-ı Kerim"')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Configure Android background audio
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('android/app/src/main/AndroidManifest.xml')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
              '<manifest xmlns:android="http://schemas.android.com/apk/res/android" xmlns:tools="http://schemas.android.com/tools">',
              1,
          )
          permissions = '''\n    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.WAKE_LOCK"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"/>\n'''
          marker = '<application'
          if marker not in text:
              raise SystemExit('application marker not found in AndroidManifest.xml')
          text = text.replace(marker, permissions + '    ' + marker, 1)
          text = text.replace(
              'android:name=".MainActivity"',
              'android:name="com.ryanheise.audioservice.AudioServiceActivity"',
              1,
          )
          services = '''\n        <service\n            android:name="com.ryanheise.audioservice.AudioService"\n            android:foregroundServiceType="mediaPlayback"\n            android:exported="true"\n            tools:ignore="Instantiatable">\n            <intent-filter>\n                <action android:name="android.media.browse.MediaBrowserService" />\n            </intent-filter>\n        </service>\n        <receiver\n            android:name="com.ryanheise.audioservice.MediaButtonReceiver"\n            android:exported="true"\n            tools:ignore="Instantiatable">\n            <intent-filter>\n                <action android:name="android.intent.action.MEDIA_BUTTON" />\n            </intent-filter>\n        </receiver>\n'''
          if '</application>' not in text:
              raise SystemExit('application closing tag not found')
          text = text.replace('</application>', services + '    </application>', 1)
          required = [
              'AudioServiceActivity',
              'AudioService',
              'MediaButtonReceiver',
              'FOREGROUND_SERVICE_MEDIA_PLAYBACK',
          ]
          if not all(value in text for value in required):
              raise SystemExit('background audio manifest patch incomplete')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Fetch and validate bundled content
        run: python3 tool/fetch_content.py

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze app code
        run: flutter analyze lib --no-fatal-infos

      - name: Run all tests
        run: flutter test

      - name: Build ARM64 test APK
        run: flutter build apk --release --target-platform android-arm64 --build-number=${{ github.run_number }}

      - name: Verify ARM64 APK package and signature
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"

          BUILD_TOOLS="$(find "$ANDROID_SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$BUILD_TOOLS/apksigner"
          test -x "$BUILD_TOOLS/aapt"

          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"

          BADGING="$($BUILD_TOOLS/aapt dump badging "$APK")"
          echo "$BADGING" | head -n 8
          echo "$BADGING" | grep -q "package: name='com.omzdmr.quran_i_kerim'"

          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libapp.so'
          if unzip -l "$APK" | grep -Eq 'lib/(armeabi-v7a|x86|x86_64)/libapp.so'; then
            echo 'Unexpected non-ARM64 Flutter app library found in ARM64 APK.' >&2
            exit 1
          fi

          stat -c 'APK size: %s bytes' "$APK"
          sha256sum "$APK"

      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: quran-i-kerim-arm64-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
