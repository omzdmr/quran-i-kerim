name: French core locale validation

on:
  push:
    branches: [ manual/french-core-locale ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Run French core locale tests
        run: |
          timeout 180s flutter test \
            test/app_locale_resolver_test.dart \
            test/app_localizations_test.dart \
            test/arb_localization_parity_test.dart \
            test/locale_metadata_test.dart \
            --reporter expanded
