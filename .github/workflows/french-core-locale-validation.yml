name: French core locale validation

on:
  push:
    branches: [ manual/french-core-locale ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Fetch and validate bundled content
        run: python3 tool/fetch_content.py

      - name: Get dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Validate French locale wiring and parity
        run: |
          python3 - <<'PY'
          import ast
          import json
          import re
          from pathlib import Path

          root = Path('.')
          arb_dir = root / 'lib/src/l10n/arb'
          locales = ['en', 'tr', 'ar', 'az', 'ru', 'fr']

          arb_keys = {}
          for locale in locales:
              data = json.loads((arb_dir / f'app_{locale}.arb').read_text())
              keys = {key for key in data if not key.startswith('@')}
              assert keys, f'empty ARB: {locale}'
              arb_keys[locale] = keys
          expected_arb = arb_keys['en']
          for locale in locales:
              assert arb_keys[locale] == expected_arb, (
                  f'ARB parity mismatch for {locale}: '
                  f'missing={sorted(expected_arb-arb_keys[locale])}, '
                  f'extra={sorted(arb_keys[locale]-expected_arb)}'
              )

          def dart_map_keys(path):
              text = Path(path).read_text()
              return set(re.findall(r"^\s*'([^']+)':", text, flags=re.M))

          core_paths = {
              'tr': 'lib/src/l10n/strings/strings_tr.dart',
              'en': 'lib/src/l10n/strings/strings_en.dart',
              'ar': 'lib/src/l10n/strings/strings_ar.dart',
              'az': 'lib/src/l10n/strings/strings_az.dart',
              'ru': 'lib/src/l10n/strings/strings_ru.dart',
              'fr': 'lib/src/l10n/strings/strings_fr.dart',
          }
          core_keys = {k: dart_map_keys(v) for k, v in core_paths.items()}
          expected_core = core_keys['en']
          for locale in locales:
              assert core_keys[locale] == expected_core, (
                  f'core string parity mismatch for {locale}: '
                  f'missing={sorted(expected_core-core_keys[locale])}, '
                  f'extra={sorted(core_keys[locale]-expected_core)}'
              )

          app = Path('lib/src/l10n/app_localizations.dart').read_text()
          for needle in [
              "import 'strings/strings_fr.dart';",
              "Locale('fr')",
              "'fr' => frStrings",
              "String get french => _value('french');",
              "String get frenchDescription => _value('frenchDescription');",
          ]:
              assert needle in app, f'missing AppLocalizations wiring: {needle}'

          settings = Path(
              'lib/src/features/settings/settings_screen.dart'
          ).read_text()
          for needle in [
              "code: 'FR'",
              "title: l10n.french",
              "subtitle: l10n.frenchDescription",
              "settings.setLocale(const Locale('fr'))",
              "'Français'",
          ]:
              assert needle in settings, f'missing Settings French wiring: {needle}'

          resolver_test = Path('test/app_locale_resolver_test.dart').read_text()
          assert "Locale('fr')" in resolver_test
          assert "expect(locale.languageCode, 'fr')" in resolver_test

          metadata = Path('lib/src/l10n/locale_metadata.dart').read_text()
          assert "'fr': AppLocaleMetadata(" in metadata
          fr_block = metadata.split("'fr': AppLocaleMetadata(", 1)[1].split("),", 1)[0]
          assert "humanReviewRequired: true" in fr_block
          assert "nativeName: 'Français'" in fr_block

          print(
              f'French core locale static validation passed: '
              f'{len(expected_arb)} ARB keys, {len(expected_core)} core keys.'
          )
          PY
