name: Apply prayer v07 patch

on:
  push:
    branches: [ feature/reader-ux-v04 ]
    paths:
      - tool/patch_prayer_v07.py
      - .github/workflows/prayer-v07-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply prayer v07 patch
        run: python3 tool/patch_prayer_v07.py

      - name: Commit patched prayer screen
        run: |
          if git diff --quiet -- lib/src/features/prayer/presentation/prayer_screen.dart; then
            echo "Prayer screen already patched."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/src/features/prayer/presentation/prayer_screen.dart
          git commit -m "Add prayer settings and regional city UX"
          git push
