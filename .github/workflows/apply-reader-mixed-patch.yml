name: Apply Reader mixed patch

on:
  push:
    branches:
      - automation/reader-mixed-integration
    paths:
      - tools/apply_reader_mixed_patch.py
      - .github/workflows/apply-reader-mixed-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Apply verified Reader patch
        run: python3 tools/apply_reader_mixed_patch.py

      - name: Remove temporary patch machinery
        run: rm tools/apply_reader_mixed_patch.py .github/workflows/apply-reader-mixed-patch.yml

      - name: Verify patch whitespace
        run: git diff --check

      - name: Commit integrated Reader
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate mixed Quran Reader"
          git push origin "HEAD:${GITHUB_REF_NAME}"
