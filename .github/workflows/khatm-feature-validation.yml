name: Khatm Feature Validation

on:
  push:
    branches:
      - manual/khatm-yearly-target

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Fetch bundled content
        run: python3 tool/fetch_content.py

      - name: Get dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Check formatting
        run: |
          dart format --output=none --set-exit-if-changed \
            lib/src/features/plans/reading_plan_store.dart \
            lib/src/features/plans/plans_screen.dart \
            lib/src/l10n/strings/plan_strings.dart \
            test/reading_plan_store_test.dart

      - name: Analyze changed plan code
        run: |
          flutter analyze --no-fatal-infos \
            lib/src/features/plans/reading_plan_store.dart \
            lib/src/features/plans/plans_screen.dart \
            lib/src/l10n/strings/plan_strings.dart

      - name: Run focused tests
        run: |
          flutter test \
            test/reading_plan_store_test.dart \
            test/plan_strings_test.dart
